name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Pine strategy contract
        run: python scripts/validate_strategy.py strategies/gold_trend_breakout.pine

      - name: Validate crypto strategy contract
        run: python scripts/validate_crypto_strategy.py strategies/crypto_cycle_smart_hold.pine

      - name: Validate crypto regime strategy contract
        run: python scripts/validate_crypto_regime_strategy.py strategies/crypto_regime_compounder.pine

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
